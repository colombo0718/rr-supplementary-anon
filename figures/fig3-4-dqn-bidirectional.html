<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 3-4 Q-table distillation DQN: bidirectional mutual-learning architecture</title>
<style>
  body { margin: 0; padding: 24px; background: #fff;
         font-family: Arial, "Helvetica Neue", sans-serif; }
  .figwrap { display: flex; justify-content: center; }
  .figwrap svg { width: 720px; height: auto; }
</style>
</head>
<body>
<div class="figwrap">
  <svg viewBox="0 -28 600 348" xmlns="http://www.w3.org/2000/svg">
    <!-- Background panels -->
    <rect x="10" y="10" width="250" height="180" rx="12" fill="#e8f4fb" stroke="#0078d7" stroke-width="1.5"/>
    <rect x="340" y="10" width="250" height="180" rx="12" fill="#f0f0f0" stroke="#555" stroke-width="1.5"/>

    <!-- Q-Table title -->
    <text x="135" y="36" text-anchor="middle" fill="#0078d7" font-size="14" font-weight="bold">Q-Table</text>
    <text x="135" y="52" text-anchor="middle" fill="#0078d7" font-size="11">(teacher)</text>

    <!-- Q-Table cell illustration -->
    <rect x="40"  y="62" width="30" height="24" rx="3" fill="#fff"     stroke="#0078d7" stroke-width="1"/>
    <rect x="74"  y="62" width="30" height="24" rx="3" fill="#b3d9f5"  stroke="#0078d7" stroke-width="1"/>
    <rect x="108" y="62" width="30" height="24" rx="3" fill="#fff"     stroke="#0078d7" stroke-width="1"/>
    <rect x="142" y="62" width="30" height="24" rx="3" fill="#5bb0e8"  stroke="#0078d7" stroke-width="1"/>
    <rect x="176" y="62" width="30" height="24" rx="3" fill="#fff"     stroke="#0078d7" stroke-width="1"/>
    <rect x="210" y="62" width="30" height="24" rx="3" fill="#b3d9f5"  stroke="#0078d7" stroke-width="1"/>
    <rect x="40"  y="90" width="30" height="24" rx="3" fill="#5bb0e8"  stroke="#0078d7" stroke-width="1"/>
    <rect x="74"  y="90" width="30" height="24" rx="3" fill="#fff"     stroke="#0078d7" stroke-width="1"/>
    <rect x="108" y="90" width="30" height="24" rx="3" fill="#b3d9f5"  stroke="#0078d7" stroke-width="1"/>
    <rect x="142" y="90" width="30" height="24" rx="3" fill="#fff"     stroke="#0078d7" stroke-width="1"/>
    <rect x="176" y="90" width="30" height="24" rx="3" fill="#0078d7"  stroke="#0078d7" stroke-width="1"/>
    <rect x="210" y="90" width="30" height="24" rx="3" fill="#fff"     stroke="#0078d7" stroke-width="1"/>

    <!-- Q-Table Bellman label -->
    <text x="135" y="136" text-anchor="middle" fill="#0078d7" font-size="11">Bellman equation update</text>
    <text x="135" y="151" text-anchor="middle" fill="#555"    font-size="10">(theoretical guarantees)</text>

    <!-- Neural network title -->
    <text x="465" y="36" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Neural network</text>
    <text x="465" y="52" text-anchor="middle" fill="#555" font-size="11">(student)</text>

    <!-- Neural network layers: input -->
    <circle cx="370" cy="80"  r="11" fill="#ddd" stroke="#555" stroke-width="1.5"/>
    <circle cx="370" cy="110" r="11" fill="#ddd" stroke="#555" stroke-width="1.5"/>
    <circle cx="370" cy="140" r="11" fill="#ddd" stroke="#555" stroke-width="1.5"/>
    <!-- Hidden layer -->
    <circle cx="430" cy="70"  r="11" fill="#bbb" stroke="#555" stroke-width="1.5"/>
    <circle cx="430" cy="95"  r="11" fill="#bbb" stroke="#555" stroke-width="1.5"/>
    <circle cx="430" cy="120" r="11" fill="#bbb" stroke="#555" stroke-width="1.5"/>
    <circle cx="430" cy="145" r="11" fill="#bbb" stroke="#555" stroke-width="1.5"/>
    <!-- Output layer -->
    <circle cx="490" cy="90"  r="11" fill="#0078d7" stroke="#005a9e" stroke-width="1.5"/>
    <circle cx="490" cy="120" r="11" fill="#0078d7" stroke="#005a9e" stroke-width="1.5"/>
    <!-- Connections (input to hidden) -->
    <line x1="381" y1="80"  x2="419" y2="70"  stroke="#aaa" stroke-width="1"/>
    <line x1="381" y1="80"  x2="419" y2="95"  stroke="#aaa" stroke-width="1"/>
    <line x1="381" y1="110" x2="419" y2="95"  stroke="#aaa" stroke-width="1"/>
    <line x1="381" y1="110" x2="419" y2="120" stroke="#aaa" stroke-width="1"/>
    <line x1="381" y1="140" x2="419" y2="120" stroke="#aaa" stroke-width="1"/>
    <line x1="381" y1="140" x2="419" y2="145" stroke="#aaa" stroke-width="1"/>
    <!-- Connections (hidden to output) -->
    <line x1="441" y1="70"  x2="479" y2="90"  stroke="#aaa" stroke-width="1"/>
    <line x1="441" y1="95"  x2="479" y2="90"  stroke="#aaa" stroke-width="1"/>
    <line x1="441" y1="120" x2="479" y2="120" stroke="#aaa" stroke-width="1"/>
    <line x1="441" y1="145" x2="479" y2="120" stroke="#aaa" stroke-width="1"/>
    <!-- Output labels -->
    <text x="508" y="93"  fill="#0078d7" font-size="10">Q(a₁)</text>
    <text x="508" y="123" fill="#0078d7" font-size="10">Q(a₂)</text>

    <!-- Arrow definitions -->
    <defs>
      <marker id="arr-blue"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#0078d7"/>
      </marker>
      <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#107c10"/>
      </marker>
    </defs>

    <!-- Arrow 1: Q-Table to NN (distillation, routed above) -->
    <path d="M 260,60 C 295,10 310,10 340,60" fill="none" stroke="#0078d7" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="300" y="-10" text-anchor="middle" fill="#0078d7" font-size="11" font-weight="bold">NN fits Q-Table outputs (distillation)</text>

    <!-- Arrow 2: NN to Q-Table (mutual learning, routed below) -->
    <path d="M 340,155 C 310,200 295,200 260,155" fill="none" stroke="#107c10" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="300" y="218" text-anchor="middle" fill="#107c10" font-size="11" font-weight="bold">NN estimates unseen states (mutual learning)</text>

    <!-- Environment -->
    <rect x="215" y="250" width="170" height="44" rx="10" fill="#333"/>
    <text x="300" y="268" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Environment</text>
    <text x="300" y="285" text-anchor="middle" fill="#ccc" font-size="10">input state, output action</text>

    <!-- Arrows from the environment to the two models -->
    <line x1="250" y1="250" x2="170" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <line x1="350" y1="250" x2="430" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  </svg>
</div>
</body>
</html>
